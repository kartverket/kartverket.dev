backend:
  database:
    client: better-sqlite3
    connection: ':memory:'

# Inert loopback targets keep proxy configuration structurally complete without
# contacting external services. Disabled integration boundaries prevent normal
# local UI flows from calling these endpoints.
proxy:
  endpoints:
    '/opencost':
      target: http://127.0.0.1:1
    '/lighthouse':
      target: http://127.0.0.1:1
    '/grafana/api':
      target: http://127.0.0.1:1
    '/risc-proxy':
      target: http://127.0.0.1:1
      allowedHeaders:
        ['Authorization', 'GCP-Access-Token', 'GitHub-Access-Token']
    '/opencost-cacher':
      target: http://127.0.0.1:1
      credentials: forward
      changeOrigin: true
    '/security-champion-proxy':
      target: http://127.0.0.1:1
      changeOrigin: true

catalog:
  locations:
    - type: file
      target: ../../examples/local/catalog.yaml

auth:
  environment: development
  providers:
    synthetic-atlas: {}
    synthetic-compass: {}
    synthetic-multiteam: {}
    synthetic-product-area: {}
    synthetic-business-unit: {}
    synthetic-unaffiliated: {}
    synthetic-admin: {}

lighthouse:
  mode: disabled
  baseUrl: http://localhost:7007/api/proxy/lighthouse

grafana:
  domain: http://127.0.0.1:1

sikkerhetsmetrikker:
  mode: disabled

regelrett:
  mode: disabled

# The RiSc package requires these fields through its own config schema even
# while the integration is disabled. They are visibly inert local values.
ros:
  mode: disabled
  sops:
    ageKey: local-development-disabled
    backendPublicKey: local-development-disabled
    securityTeamPublicKey: local-development-disabled
    securityPlatformPublicKey: local-development-disabled

catalogCreator:
  mode: disabled

securityChampion:
  mode: disabled

opencost:
  mode: disabled
