apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: map-api
  title: Map API
  description: Synthetic backend serving map tiles and metadata
  tags: [local, api]
spec:
  type: service
  lifecycle: experimental
  owner: team-atlas
  system: map-platform
  providesApis:
    - map-api
  dependsOn:
    - resource:default/map-database
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: map-web
  title: Map Web
  description: Synthetic web application for exploring maps
  tags: [local, frontend]
spec:
  type: website
  lifecycle: experimental
  owner: team-atlas
  system: map-platform
  consumesApis:
    - map-api
  dependsOn:
    - component:default/map-api
---
