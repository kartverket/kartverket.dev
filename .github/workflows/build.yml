name: Build

on:
  workflow_dispatch:
  push:
    branches: ['main']
    # Publish semver tags as releases.
    tags: ['v*.*.*']
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - CODEOWNERS
      - 'docs/**'
      - 'terraform/**'
      - '.gitignore'
      - 'mkdocs.yml'
      - catalog-info.yaml
  pull_request:
    branches: ['main']
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - CODEOWNERS
      - 'docs/**'
      - 'terraform/**'
      - '.gitignore'
      - 'mkdocs.yml'
      - catalog-info.yaml

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: 24.x # From mise.toml
          cache: 'npm'

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn run prettier:check

      # tsc outputs type definitions to dist-types/ in the repo root, which are then consumed by the build
      - run: yarn run tsc

      - run: yarn run lint:all

      # Build the backend, which bundles it all up into the packages/backend/dist folder.
      # The configuration files here should match the one you use inside the Dockerfile below.
      - run: yarn build:backend --config ../../app-config.yaml --config ../../app-config.production.yaml

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.3'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Use sha for tags
            type=sha,format=long
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

    outputs:
      image_digest: ${{ steps.build-and-push.outputs.digest }}

  dev-deploy-argo:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
    strategy:
      matrix:
        env:
          - atgcp1-dev
    permissions:
      id-token: write

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: kartverket/skvis-apps
          identity: utviklerportal

      - name: Checkout apps repo
        uses: actions/checkout@v7
        with:
          repository: kartverket/skvis-apps
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Deploy to ${{ matrix.env }}
        run: |
          kubectl patch --type=merge --local \
            -f ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml \
            -p '{"spec":{"image":"ghcr.io/kartverket/kartverket.dev@${{needs.build.outputs.image_digest}}"}}' \
            -o yaml > ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml.new
          mv ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml.new ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml
          git add ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml
          git config --global user.email "noreply@kartverket.no"
          git config --global user.name "GitHub Actions"
          git commit -m "Deploy ${{ matrix.env }} version ${{github.ref_name}}"
          git fetch origin
          git rebase origin/main
          git push

  prod-deploy-argo:
    needs: [build, dev-deploy-argo]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
    strategy:
      matrix:
        env:
          - atgcp1-prod
    permissions:
      id-token: write

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: kartverket/skvis-apps
          identity: utviklerportal

      - name: Checkout apps repo
        uses: actions/checkout@v7
        with:
          repository: kartverket/skvis-apps
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Deploy to ${{ matrix.env }}
        run: |
          kubectl patch --type=merge --local \
            -f ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml \
            -p '{"spec":{"image":"ghcr.io/kartverket/kartverket.dev@${{needs.build.outputs.image_digest}}"}}' \
            -o yaml > ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml.new
          mv ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml.new ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml
          git add ./env/${{ matrix.env }}/utviklerportal-main/patches/application.yaml
          git config --global user.email "noreply@kartverket.no"
          git config --global user.name "GitHub Actions"
          git commit -m "Deploy ${{ matrix.env }} version ${{github.ref_name}}"
          git fetch origin
          git rebase origin/main
          git push
